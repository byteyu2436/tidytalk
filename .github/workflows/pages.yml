# 用 scripts/build_site.py 生成页面，再把 site/ 目录发布到 GitHub Pages：https://tidytalk.zayen.dev/
# 需要先在仓库 Settings › Pages 里把 Source 设为 "GitHub Actions"。
name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "site-src/**"
      - "scripts/build_site.py"
      - ".github/workflows/pages.yml"
  # 发布新版本时更新官网的更新日志
  release:
    types: [published, edited]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # 发布新版本时：Pages 只允许 main 分支发布，标签上不能直接部署，
  # 所以让 main 分支重新跑一遍这个流程（用 GITHUB_TOKEN 触发 workflow_dispatch 是允许的）
  rebuild-after-release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    # 同一时间只部署一次，但不取消正在进行的部署：推送后马上发版时，推送的那次和发版后重新生成的那次
    # 都要跑完（被取消的运行会让提交显示失败的红叉）。只管部署这一步，发版时触发重新生成的那一步不受影响
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 页面的更新日期取自源文件的提交记录，需要完整历史
          fetch-depth: 0
      - name: Build pages
        run: python3 scripts/build_site.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

      # 用 IndexNow 通知必应等搜索引擎重新抓取（密钥文件是 site/70cbd603934f81e027ff4763a9e9dec5.txt）
      - name: Notify search engines (IndexNow)
        run: |
          sleep 30
          urls=$(grep -o '<loc>[^<]*</loc>' site/sitemap.xml | sed -e 's/<loc>//' -e 's/<\/loc>//' | python3 -c 'import json,sys;print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
          body=$(printf '{"host":"tidytalk.zayen.dev","key":"70cbd603934f81e027ff4763a9e9dec5","keyLocation":"https://tidytalk.zayen.dev/70cbd603934f81e027ff4763a9e9dec5.txt","urlList":%s}' "$urls")
          echo "$body"
          curl -sS -o /dev/null -w "IndexNow HTTP %{http_code}\n" -X POST https://api.indexnow.org/indexnow \
            -H "Content-Type: application/json; charset=utf-8" -d "$body"
