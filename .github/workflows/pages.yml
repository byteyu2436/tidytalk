# 把 site/ 目录发布到 GitHub Pages：https://tidytalk.zayen.dev/
# 需要先在仓库 Settings › Pages 里把 Source 设为 "GitHub Actions"。
name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

      # 用 IndexNow 通知必应等搜索引擎重新抓取（密钥文件是 site/70cbd603934f81e027ff4763a9e9dec5.txt）
      - name: Notify search engines (IndexNow)
        run: |
          sleep 30
          urls=$(grep -o '<loc>[^<]*</loc>' site/sitemap.xml | sed -e 's/<loc>//' -e 's/<\/loc>//' | python3 -c 'import json,sys;print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
          body=$(printf '{"host":"tidytalk.zayen.dev","key":"70cbd603934f81e027ff4763a9e9dec5","keyLocation":"https://tidytalk.zayen.dev/70cbd603934f81e027ff4763a9e9dec5.txt","urlList":%s}' "$urls")
          echo "$body"
          curl -sS -o /dev/null -w "IndexNow HTTP %{http_code}\n" -X POST https://api.indexnow.org/indexnow \
            -H "Content-Type: application/json; charset=utf-8" -d "$body"
